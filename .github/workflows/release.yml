name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify tag matches package.json version
        run: node scripts/release.mjs validate-tag

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --no-progress

      - name: Lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run vscode:prepublish

      - name: Install pinned publishing tools
        env:
          npm_config_fetch_retries: 6
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: node scripts/release.mjs install-tools

      - name: Package VS Code extension (.vsix)
        run: |
          node scripts/release.mjs package "jenkins-workbench-${GITHUB_REF_NAME}.vsix"
          test -f "jenkins-workbench-${GITHUB_REF_NAME}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ./*.vsix
          overwrite: true

      - name: Publish to extension marketplaces
        id: publish-marketplaces
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/release.mjs publish "jenkins-workbench-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ./*.vsix
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
