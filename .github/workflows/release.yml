name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify tag matches package.json version
        run: node scripts/release.mjs validate-tag

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --no-progress

      - name: Lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run vscode:prepublish

      - name: Install pinned publishing tools
        env:
          npm_config_fetch_retries: 6
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: node scripts/release.mjs install-tools

      - name: Package VS Code extension (.vsix)
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NODE_ENV: "development"
        run: |
          ./node_modules/.bin/vsce package --no-dependencies -o "jenkins-workbench-${GITHUB_REF_NAME}.vsix"
          test -f "jenkins-workbench-${GITHUB_REF_NAME}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: ./*.vsix
          overwrite: true

      - name: Publish to extension marketplaces
        id: publish-marketplaces
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/release.mjs publish "jenkins-workbench-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ./*.vsix
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
